<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>currency converter</title>
    <link rel="stylesheet" href="style.css">
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
</head>
<body>
    <div class="container">
        <h2>Currency Converter</h2>
        <form>
            <div class="amount">
                <p class="am" >Enter Amount</p>
            <input type="text" placeholder="Enter Number" class="input" id="inputsec">
            </div>
            <div class="dropdown">
                <div class="from">
                    <p >From</p >
                    <div class="select-container">
                        <img class="pic" src="https://flagsapi.com/US/flat/64.png" >
                        <select name="from" class="sec"> </select>
                    </div>
                </div>
                <i  class="fa-solid fa-arrow-right-arrow-left"></i>
                <div class="to"></div>
                <div class="to">
                    <p >To</p>
                    <div class="select-container">
                        <img class="pic" src="https://flagsapi.com/PK/flat/64.png" >
                        <select name="to" class="sec"></select>
                    </div>
                </div>
            </div>
            <div class="msg">1USD = 277</div>
            <div class="btn">
                <button class="butt " id="button">Get Exchange Rate</button>
            </div>
            
        </form>
    </div>
</body>
<script src="code.js"></script>
<script src="logic.js"></script>
</html>
